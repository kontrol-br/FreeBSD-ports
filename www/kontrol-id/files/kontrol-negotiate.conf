# Kontrol-ID native Kerberos/SPNEGO authentication plugin.
# This plugin validates the browser token locally; no parent proxy is used.

plugname = 'kontrol-negotiate'

# Existing pre-auth storyboard entry used to map the authenticated username.
story_function = 'auth_pf_basic'

# Keytab created by the Kontrol-ID Domain and Keytab workflow.
keytab = '/var/db/kontrol-id-domain/krb5.keytab'

# Optional acceptor principal. Leave empty to accept any HTTP principal present
# in the keytab. Production deployments should set the firewall FQDN, e.g.:
# service_principal = 'HTTP/kontrol290.kontrol.corp@KONTROL.CORP'
service_principal = ''

# Fallback policy when the authenticated user has no explicit mapping.
defaultfiltergroup = 1
