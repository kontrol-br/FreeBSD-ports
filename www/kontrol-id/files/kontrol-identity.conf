# Kontrol-ID native transparent identity plugin
plugname = 'kontrol-identity'
story_function = 'auth_ip'
helper_program = '/usr/local/libexec/kontrol-identity-helper'
helper_config = '/usr/local/etc/kontrol-identity.conf'
helper_children = 32
helper_timeout_ms = 5000
ipgroups = '/usr/local/etc/e2guardian/lists/authplugins/ipgroups'
usergroups = '/usr/local/etc/e2guardian/lists/authplugins/filtergroupslist'
unknown_user = 'unknown'
unknown_action = 'allow'
portal_url = ''
defaulttransparentfiltergroup = 1
